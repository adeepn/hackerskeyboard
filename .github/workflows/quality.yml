# SPDX-License-Identifier: Apache-2.0

name: Quality gates

on:
  pull_request:
    branches:
      - v2
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run repository checks
        uses: j178/prek-action@v2

  gradle-wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Bootstrap Gradle
        run: ./gradlew --version --no-daemon

      - name: Resolve target Android Gradle Plugin
        run: ./gradlew -p verification/agp-resolution resolveAgp --no-daemon

  android-build:
    name: Android debug and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug and unsigned release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify packaged native ABIs
        run: >-
          scripts/verify-apk-native-libs.sh
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: hackers-keyboard-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android-instrumentation:
    name: JNI dictionary smoke (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Run JNI dictionary smoke test
        run: >-
          ./gradlew :app:pixel2Api36DebugAndroidTest
          --no-daemon
          --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jni-dictionary-smoke-${{ github.sha }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7
