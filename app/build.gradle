// Modified for Hacker's Keyboard v2; see the repository history for details.
apply plugin: 'com.android.application'

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 36
    ndkVersion androidNdkVersion

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdk 24
        targetSdk 26
        versionCode 1041001
        versionName "v1.41.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version androidCmakeVersion
        }
    }
    testOptions {
        managedDevices {
            localDevices {
                pixel2Api36 {
                    device = "Pixel 2"
                    apiLevel = 36
                    systemImageSource = "aosp"
                }
            }
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError = true
        checkReleaseBuilds = false
        warningsAsErrors = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation "com.android.support:support-compat:26.0.0"
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
