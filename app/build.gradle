// Modified for Hacker's Keyboard v2; see the repository history for details.
apply plugin: 'com.android.application'

android {
    namespace 'com.baodeep.hackerskeyboard'
    compileSdk 37
    ndkVersion androidNdkVersion

    defaultConfig {
        applicationId 'com.baodeep.hackerskeyboard'
        minSdk 24
        targetSdk 26
        versionCode providers.gradleProperty('appVersionCode').get().toInteger()
        versionName providers.gradleProperty('appVersionName').get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version androidCmakeVersion
        }
    }
    testOptions {
        managedDevices {
            localDevices {
                pixel2Api37 {
                    device = "Pixel 2"
                    sdkVersion = 37
                    systemImageSource = "google"
                    require64Bit = true
                    testedAbi = "x86_64"
                    pageAlignment = com.android.build.api.dsl.ManagedVirtualDevice.PageAlignment.FORCE_4KB_PAGES
                }
            }
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError = true
        checkReleaseBuilds = false
        warningsAsErrors = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
