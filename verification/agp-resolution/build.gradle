buildscript {
    def repositoryProperties = new Properties()
    file('../../gradle.properties').withInputStream {
        repositoryProperties.load(it)
    }

    def targetAgpVersion = repositoryProperties.getProperty('agpVersion')
    if (!targetAgpVersion) {
        throw new GradleException(
            'agpVersion is not set in the repository gradle.properties'
        )
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${targetAgpVersion}"
    }
}

tasks.register('resolveAgp') {
    def repositoryProperties = new Properties()
    file('../../gradle.properties').withInputStream {
        repositoryProperties.load(it)
    }
    def targetAgpVersion = repositoryProperties.getProperty('agpVersion')

    inputs.property('agpVersion', targetAgpVersion)

    doLast {
        def artifact = buildscript.configurations.classpath.resolvedConfiguration
            .resolvedArtifacts.find {
                it.moduleVersion.id.group == 'com.android.tools.build' &&
                    it.name == 'gradle'
            }
        if (artifact == null || artifact.moduleVersion.id.version != targetAgpVersion) {
            throw new GradleException("AGP ${targetAgpVersion} was not resolved")
        }
        logger.lifecycle("Resolved AGP ${artifact.moduleVersion.id.version}")
    }
}
