minimum_prek_version = "0.3.13"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", files = "^(AGENTS\\.md|docs/|\\.github/|prek\\.toml$)" },
  { id = "mixed-line-ending", args = ["--fix=no"], files = "^(AGENTS\\.md|docs/|\\.github/|prek\\.toml$)" },
  { id = "trailing-whitespace", files = "^(AGENTS\\.md|docs/|\\.github/|prek\\.toml$)" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "application-identity", name = "Application identity", entry = "python3 scripts/verify-application-identity.py", language = "system", pass_filenames = false, always_run = true },
  { id = "androidx-migration", name = "AndroidX migration", entry = "python3 scripts/verify-androidx-migration.py", language = "system", pass_filenames = false, always_run = true },
  { id = "manifest-component-tests", name = "Manifest component tests", entry = "python3 scripts/test-manifest-components.py", language = "system", pass_filenames = false, always_run = true },
  { id = "manifest-components", name = "Manifest components", entry = "python3 scripts/verify-manifest-components.py", language = "system", pass_filenames = false, always_run = true },
  { id = "settings-contract-tests", name = "Settings contract tests", entry = "python3 scripts/test-settings-contract.py", language = "system", pass_filenames = false, always_run = true },
  { id = "settings-contract", name = "Settings contract", entry = "python3 scripts/verify-settings-contract.py", language = "system", pass_filenames = false, always_run = true },
  { id = "release-configuration", name = "Release configuration", entry = "python3 scripts/verify-release-configuration.py", language = "system", pass_filenames = false, always_run = true },
  { id = "keyboard-xml-semantics", name = "Keyboard XML semantics", entry = "python3 scripts/verify-keyboard-xml-semantics.py", language = "system", pass_filenames = false, always_run = true },
  { id = "android-lint", name = "Android lint", entry = "./gradlew :app:lintDebug --no-daemon --stacktrace", language = "system", pass_filenames = false, always_run = true, stages = ["manual"] },
]
